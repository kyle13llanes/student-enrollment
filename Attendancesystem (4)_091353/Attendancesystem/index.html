<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Enrollment System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>Student Enrollment</h1>
            <h2>System</h2>
            
            <div id="error-msg" class="alert alert-error" style="display:none;"></div>
            
            <form id="loginForm" class="form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Enter your username" autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
            
            <p class="auth-link">Don't have an account? <a href="signup.html">Sign up here</a></p>
            
            <div class="demo-credentials">
                <p><strong>Demo Account:</strong></p>
                <p>Username: admin</p>
                <p>Password: password</p>
            </div>
        </div>
    </div>
    
    <script src="store.js"></script>
    <script src="script.js"></script>
</body>
</html>
